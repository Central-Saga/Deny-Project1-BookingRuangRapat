services:
  backend:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetspace_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-meetspace_db}
      - DB_USERNAME=${DB_USERNAME:-meetspace_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: meetspace_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: meetspace_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-meetspace_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_required}
      POSTGRES_DB: ${DB_DATABASE:-meetspace_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetspace_user -d meetspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: